[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "0.1.0"
description = "Offline prompt-injection scanner for inbound text, with a labelled evaluation harness"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
promptshield = "promptshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
